<svg width="1280" height="280" viewBox="0 0 1280 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated frontend to agent system pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF7F4"/>
    </linearGradient>
    <linearGradient id="line" x1="128" y1="140" x2="1152" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007C73"/>
      <stop offset="0.5" stop-color="#6554C0"/>
      <stop offset="1" stop-color="#C94F3D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17202E" flood-opacity="0.12"/>
    </filter>
    <style>
      .track { stroke-dasharray: 20 16; animation: move 5s linear infinite; }
      .node { animation: lift 5.5s ease-in-out infinite; transform-origin: center; }
      .n2 { animation-delay: .5s; }
      .n3 { animation-delay: 1s; }
      .n4 { animation-delay: 1.5s; }
      .n5 { animation-delay: 2s; }
      .n6 { animation-delay: 2.5s; }
      @keyframes move { to { stroke-dashoffset: -72; } }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>

  <rect width="1280" height="280" rx="22" fill="url(#bg)"/>
  <path d="M128 140H1152" stroke="#D7DEE8" stroke-width="8" stroke-linecap="round"/>
  <path class="track" d="M128 140H1152" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#soft)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g class="node" transform="translate(78 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#007C73" font-size="15" font-weight="800">Frontend</text>
      <text x="24" y="69" fill="#667085" font-size="13">workspace UI</text>
      <text x="24" y="91" fill="#667085" font-size="13">state machine</text>
    </g>
    <g class="node n2" transform="translate(264 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#6554C0" font-size="15" font-weight="800">SSE API</text>
      <text x="24" y="69" fill="#667085" font-size="13">token stream</text>
      <text x="24" y="91" fill="#667085" font-size="13">tool events</text>
    </g>
    <g class="node n3" transform="translate(450 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#17202E" font-size="15" font-weight="800">Agent</text>
      <text x="24" y="69" fill="#667085" font-size="13">LangGraph</text>
      <text x="24" y="91" fill="#667085" font-size="13">middleware</text>
    </g>
    <g class="node n4" transform="translate(636 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#B77912" font-size="15" font-weight="800">Tools</text>
      <text x="24" y="69" fill="#667085" font-size="13">file / Python</text>
      <text x="24" y="91" fill="#667085" font-size="13">search / fetch</text>
    </g>
    <g class="node n5" transform="translate(822 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#007C73" font-size="15" font-weight="800">Memory</text>
      <text x="24" y="69" fill="#667085" font-size="13">vector + BM25</text>
      <text x="24" y="91" fill="#667085" font-size="13">hybrid fusion</text>
    </g>
    <g class="node n6" transform="translate(1008 76)">
      <rect width="152" height="128" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/>
      <text x="24" y="42" fill="#C94F3D" font-size="15" font-weight="800">Trace</text>
      <text x="24" y="69" fill="#667085" font-size="13">Guardian</text>
      <text x="24" y="91" fill="#667085" font-size="13">Langfuse</text>
    </g>
  </g>
</svg>
